[package]
name = "novelgainker-desktop"
version = "0.1.0"
description = "NovelGainker Windows desktop application"
authors = ["NovelGainker contributors"]
edition = "2021"

[lib]
name = "novelgainker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
app-core = { path = "../../../crates/app-core" }
novelgainker-domain = { path = "../../../crates/novelgainker-domain" }
novelgainker-workflows = { path = "../../../crates/novelgainker-workflows" }

[dev-dependencies]
sha2 = "0.10"
