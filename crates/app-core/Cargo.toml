[package]
name = "app-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
novelgainker-domain = { path = "../novelgainker-domain" }
novelgainker-validation = { path = "../novelgainker-validation" }
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1"
[build-dependencies]
serde_json = "1"
sha2 = "0.10"
